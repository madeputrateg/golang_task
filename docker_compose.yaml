services:
  db:
    image: postgres:16-alpine
    ports:
      - 5432:5432
    environment:
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=db
      - POSTGRES_USER=root
    # healthcheck:
    #   test:
    #     [
    #       "CMD-SHELL",
    #       "pg_isready -U root"
    #     ]

    #   interval: 5s
    #   timeout: 5s
    #   retries: 5
  server:
    build: .
    ports:
      - 8080:8080
    environment:
      - DBHOST=db
      - DBUSER=root
      - DBPASSWORD=password
      - DBNAME=db
      - DBPORT=5432
      - SEEDDB=true
      - SERVERPORT=8080
    depends_on:
      - db
    
